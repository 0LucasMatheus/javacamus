<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Verificar código - Javacamus</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <style>
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa;
        }
        .login-card {
            max-width: 420px;
            width: 100%;
            padding: 2rem;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            background-color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card text-center">
            <h3 class="mb-2">Verificar código</h3>
            <p class="text-muted small mb-4">Digite o código de 5 dígitos enviado para o seu e-mail e defina uma nova senha.</p>

            <!-- mensagem generica de sucesso ou erro-->
            <div class="alert alert-info" th:if="${info}" th:text="${info}"></div>
            <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>

            <!-- o email fica guardado na sessao-->
            <form th:action="@{/recuperar-senha/verificar}" method="post">
                <div class="form-group mb-3">
                    <input type="text" class="form-control text-center" name="codigo" maxlength="5"
                           pattern="[0-9]{5}" placeholder="00000" required>
                </div>
                <div class="form-group mb-3">
                    <input type="password" class="form-control" name="novaSenha" placeholder="Nova senha" required>
                </div>
                <div class="form-group mb-3">
                    <input type="password" class="form-control" name="confirmarSenha" placeholder="Confirmar nova senha" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Redefinir senha</button>
            </form>

            <div class="mt-3">
                <a th:href="@{/recuperar-senha}" class="text-decoration-none">Solicitar novo código</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
