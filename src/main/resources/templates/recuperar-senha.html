<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Recuperar senha - Javacamus</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <style>
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa;
        }
        .login-card {
            max-width: 420px;
            width: 100%;
            padding: 2rem;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            background-color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card text-center">
            <h3 class="mb-2">Recuperar senha</h3>
            <p class="text-muted small mb-4">Informe seu e-mail cadastrado. Enviaremos um código de recuperação.</p>

            <form th:action="@{/recuperar-senha}" method="post">
                <div class="form-group mb-3">
                    <input type="email" class="form-control" name="email" placeholder="E-mail" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Enviar código</button>
            </form>

            <div class="mt-3">
                <a th:href="@{/login}" class="text-decoration-none">Voltar para o login</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
