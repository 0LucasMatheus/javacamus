<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Login - Javacamus</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <style>
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa;
        }
        .login-card {
            max-width: 400px;
            width: 100%;
            padding: 2rem;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            background-color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card text-center">
            <h3 class="mb-4">Javacamus</h3>

            <!-- o spring security que redireciona pra /login?erro ou /login?logout  -->
            <div class="alert alert-danger" th:if="${param.erro}">
                Usuário ou senha inválidos.
            </div>
            <div class="alert alert-success" th:if="${param.logout}">
                Sessão encerrada com sucesso.
            </div>
            <div class="alert alert-success" th:if="${sucesso}" th:text="${sucesso}"></div>

            <img th:src="@{/peixe-cafe.jpg}" alt="Logo" class="logo">
            <h3 class="mb-4">Bem-vindo</h3>

            <!-- spring security pega o post pra /login e confere usuario/senha -->
            <form th:action="@{/login}" method="post">
                <div class="form-group mb-3">
                    <label for="username" class="form-label">Usuário</label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="Digite seu nome de usuário" required>
                </div>
                <div class="form-group mb-3">
                    <label for="password" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Digite sua senha" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Entrar</button>
            </form>

            <div class="mt-3">
                <a th:href="@{/recuperar-senha}" class="text-decoration-none">Esqueceu sua senha?</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
