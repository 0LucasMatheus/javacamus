<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title>Abrir Chamado</title>
</head>
<body>

<div layout:fragment="content">

    <div class="d-flex align-items-center gap-3 mb-4">
        <a th:href="@{/chamados}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i>
        </a>
        <h2 class="fw-bold mb-0">Abrir Chamado</h2>
    </div>

    <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>

    <div class="card shadow-sm" style="max-width: 640px;">
        <div class="card-body p-4">
            <!-- solicitante, data e status quem preenche e o microservico -->
            <form th:action="@{/chamados}" method="post">

                <div class="mb-3">
                    <label for="titulo" class="form-label fw-medium">
                        <i class="bi bi-card-heading me-1"></i>Título
                    </label>
                    <input type="text" id="titulo" name="titulo" class="form-control"
                           th:value="${titulo}" placeholder="Ex: Impressora não imprime" required/>
                </div>

                <div class="mb-4">
                    <label for="descricao" class="form-label fw-medium">
                        <i class="bi bi-text-paragraph me-1"></i>Descrição
                    </label>
                    <textarea id="descricao" name="descricao" class="form-control" rows="5"
                              th:text="${descricao}" placeholder="Explique o problema" required></textarea>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-send me-1"></i> Abrir Chamado
                    </button>
                    <a th:href="@{/chamados}" class="btn btn-outline-secondary">Cancelar</a>
                </div>

            </form>
        </div>
    </div>

</div>

</body>
</html>
