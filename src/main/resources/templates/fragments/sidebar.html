<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="UTF-8">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    </head>
    <body>
        <!-- esse fragmento e incluido no layout.html, mesma sidebar em toda pagina interna -->
        <div th:fragment="sidebar">
            <div id="sidebar">
                <h4 class="text-center py-3">Javacamus</h4>
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}">
                            <i class="bi bi-house"></i><span class="d-none d-md-inline ms-1">Home</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/chamados}">
                            <i class="bi bi-headset"></i><span class="d-none d-md-inline ms-1">Chamados</span>
                        </a>
                    </li>
                    <!-- cada link so aparece se o usuario logado tiver a role, sec:authorize cuida disso -->
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/admin/usuarios}">
                            <i class="bi bi-people-fill"></i><span class="d-none d-md-inline ms-1">Usuários</span>
                        </a>
                    </li>
                </ul>
                <!-- versao do pom, ver o readme -->
                <small class="d-block text-center text-white-50 mt-4" th:text="'v' + ${@environment.getProperty('app.versao')}">v1.0.0</small>
            </div>
        </div>
    </body>
</html>
