spring.application.name=javacamus

spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE}
spring.data.mongodb.auto-index-creation=true

app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:troque-esta-senha}
app.admin.email=${ADMIN_EMAIL:admin@example.com}

app.tecnico.username=${TECNICO_USERNAME:tecnico}
app.tecnico.password=${TECNICO_PASSWORD:tecnico123}
app.tecnico.email=${TECNICO_EMAIL:tecnico@example.com}

app.usuario.username=${USUARIO_USERNAME:usuario}
app.usuario.password=${USUARIO_PASSWORD:usuario123}
app.usuario.email=${USUARIO_EMAIL:usuario@example.com}

# mesmo segredo do microservico de chamados, minimo 32 caracteres
app.jwt.secret=${JWT_SECRET}
app.chamados.url=${CHAMADOS_URL:http://localhost:8081}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

logging.level.com.umc.javacamus=DEBUG
